# Static site, unprivileged nginx (listens on 8080, runs as a non-root user).
server_tokens off;

# Basic abuse limits: small buffers, short timeouts. (Rate limiting is left to
# the edge/tunnel: behind cloudflared every client shares one source IP.)
client_body_buffer_size 1k;
client_header_buffer_size 1k;
client_max_body_size 1k;
large_client_header_buffers 2 4k;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
keepalive_timeout 15s;

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Read-only site: only GET/HEAD (and OPTIONS) make sense.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Never serve dotfiles or source maps.
    location ~ /\.      { return 404; }
    location ~ \.map$   { return 404; }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build output: safe to cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Unhashed root files (theme/analytics init scripts): revalidate.
    location ~* ^/[^/]+\.(js|txt|xml)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /sitemap.xml { default_type application/xml; include /etc/nginx/snippets/security-headers.conf; }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
